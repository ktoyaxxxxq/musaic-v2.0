<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musaic — Музыкальная медиатека</title>
    <meta name="description" content="Профессиональная музыкальная медиатека с расширенными инструментами создания, AI-функциями и локальным хранилищем.">
    <meta property="og:title" content="Musaic">
    <meta property="og:description" content="Профессиональная музыкальная медиатека с расширенными инструментами создания, AI-функциями и локальным хранилищем.">
    <meta property="og:type" content="website">
    <meta name="theme-color" content="#09090b">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Bricolage+Grotesque:wght@600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Dela+Gothic+One&family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Lora:ital,wght@0,600;0,700;1,600&family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@400;500;600;700;800;900&family=Oswald:wght@500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rubik:wght@500;700;800;900&family=Russo+One&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Syne:wght@600;700;800&family=Unbounded:wght@500;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            /* Base Theme Tokens - will be overridden by JS */
            --bg-color: #09090b;
            --accent-color: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.45);
            --accent-glow-strong: rgba(16, 185, 129, 0.7);
            --card-bg: rgba(20, 20, 25, 0.65);
            --card-bg-hover: rgba(28, 28, 35, 0.8);
            --text-scale: 1;
            --ui-scale: 1;
            --radius-factor: 1.3;
            --blur-intensity: 24px;
            --font-main: 'Geist', 'Inter', sans-serif;
            --font-mono: 'Geist Mono', 'JetBrains Mono', monospace;
            --letter-spacing: -0.025em;
            --font-weight: 500;
            --card-opacity: 0.65;
            --header-blur: 24px;
            --anim-speed: 0.3s;
            --anim-ease: cubic-bezier(0.16, 1, 0.3, 1);
            --sidebar-width: 260px;
            --player-height: 96px;

            /* Surface variants */
            --surface-1: rgba(18, 18, 22, 0.9);
            --surface-2: rgba(24, 24, 28, 0.85);
            --surface-3: rgba(32, 32, 38, 0.8);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-accent: rgba(255, 255, 255, 0.12);
            --border-strong: rgba(255, 255, 255, 0.2);

            /* Gradient tokens */
            --gradient-aurora: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 60%),
                               radial-gradient(ellipse 60% 80% at 100% 100%, rgba(59, 130, 246, 0.12) 0%, transparent 60%);
            --gradient-radial: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.18) 0%, transparent 70%);
            --gradient-mesh: linear-gradient(135deg, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
                             linear-gradient(225deg, rgba(59, 130, 246, 0.06) 0%, transparent 50%);

            /* Shadow tokens */
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.4);
            --shadow-xl: 0 20px 48px rgba(0, 0, 0, 0.45);
            --shadow-glow: 0 0 24px var(--accent-glow);
            --shadow-glow-strong: 0 0 40px var(--accent-glow-strong);
        }

        @media (prefers-reduced-motion: reduce) {
            :root {
                --anim-speed: 0.01s;
            }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        html {
            color-scheme: dark;
            font-size: calc(16px * var(--text-scale, 1));
            background-color: var(--bg-color);
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: #fafafa;
            overflow-x: hidden;
            letter-spacing: var(--letter-spacing);
            font-weight: var(--font-weight);
            font-size: 1rem;
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Font feature settings for better typography */
        .font-main {
            font-family: var(--font-main);
            font-feature-settings: "cv02", "cv03", "cv04", "cv11", "ss01", "ss02", "liga", "calt", "kern";
            font-variant-ligatures: common-ligatures contextual;
            font-variant-numeric: tabular-nums;
        }

        .font-mono {
            font-family: var(--font-mono);
            font-variant-ligatures: common-ligatures;
        }

        /* Dynamic Classes using Variables */
        .theme-accent { color: var(--accent-color) !important; }
        .theme-bg-accent { background-color: var(--accent-color) !important; }
        .theme-border-accent { border-color: var(--accent-color) !important; }
        .theme-fill-accent { fill: var(--accent-color) !important; }
        .theme-glow { filter: drop-shadow(0 0 10px var(--accent-glow)); }

        .theme-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(var(--blur-intensity));
            border-radius: calc(1.5rem * var(--radius-factor));
            border: 1px solid var(--border-subtle);
            transition: background-color 0.25s var(--anim-ease), border-color 0.25s var(--anim-ease), box-shadow 0.25s var(--anim-ease), transform 0.2s var(--anim-ease);
        }

        .theme-card-hover:hover {
            background-color: var(--card-bg-hover);
            border-color: var(--border-accent);
            box-shadow: var(--shadow-lg);
        }

        .theme-card-glow:hover {
            box-shadow: var(--shadow-lg), var(--shadow-glow);
        }

        /* Surface layers */
        .surface-1 { background-color: var(--surface-1); backdrop-filter: blur(var(--blur-intensity)); }
        .surface-2 { background-color: var(--surface-2); backdrop-filter: blur(var(--blur-intensity)); }
        .surface-3 { background-color: var(--surface-3); backdrop-filter: blur(var(--blur-intensity)); }

        /* Global Theme-Styled Dark Scrollbars (zero white bars or bright arrows anywhere) */
        @supports not selector(::-webkit-scrollbar) {
            * {
                scrollbar-width: thin;
                scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
            }
            .custom-scrollbar {
                scrollbar-width: thin;
                scrollbar-color: rgba(255, 255, 255, 0.18) transparent;
            }
        }
        *::-webkit-scrollbar {
            width: 7px;
            height: 7px;
        }
        *::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 9999px;
        }
        *::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            border: 1.5px solid transparent;
            background-clip: padding-box;
        }
        *::-webkit-scrollbar-thumb:hover {
            background: color-mix(in srgb, var(--accent-color) 52%, rgba(255, 255, 255, 0.25));
            border: 1.5px solid transparent;
            background-clip: padding-box;
        }
        *::-webkit-scrollbar-button,
        *::-webkit-scrollbar-button:single-button,
        *::-webkit-scrollbar-button:horizontal:decrement,
        *::-webkit-scrollbar-button:horizontal:increment,
        *::-webkit-scrollbar-button:vertical:decrement,
        *::-webkit-scrollbar-button:vertical:increment {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        *::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* Sleek Custom Scrollbar for panels, lists & modals */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.025);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.17);
            border-radius: 9999px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: background 0.2s ease;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: color-mix(in srgb, var(--accent-color) 68%, rgba(255, 255, 255, 0.28));
        }
        .custom-scrollbar::-webkit-scrollbar-corner {
            background: transparent;
        }

        /* Hidden scrollbar utility */
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Animations */
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slide-in-right {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes scale-in {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .animate-in {
            animation: fade-in-up calc(var(--anim-speed) * 1) var(--anim-ease) forwards;
        }
        .animate-in-fast { animation-duration: calc(var(--anim-speed) * 0.6); }
        .animate-in-slow { animation-duration: calc(var(--anim-speed) * 1.4); }

        .stagger-1 { animation-delay: calc(var(--anim-speed) * 0.1); }
        .stagger-2 { animation-delay: calc(var(--anim-speed) * 0.15); }
        .stagger-3 { animation-delay: calc(var(--anim-speed) * 0.2); }
        .stagger-4 { animation-delay: calc(var(--anim-speed) * 0.25); }
        .stagger-5 { animation-delay: calc(var(--anim-speed) * 0.3); }

        .animate-fade-in { animation: fade-in var(--anim-speed) var(--anim-ease); }
        .animate-slide-in { animation: slide-in-right var(--anim-speed) var(--anim-ease); }
        .animate-scale-in { animation: scale-in calc(var(--anim-speed) * 0.8) var(--anim-ease); }

        /* Utility classes */
        .tracking-tighter { letter-spacing: -0.04em; }
        .tracking-tight { letter-spacing: -0.025em; }
        .tracking-normal { letter-spacing: 0; }
        .tracking-wide { letter-spacing: 0.02em; }

        .text-balance { text-wrap: balance; }
        .text-pretty { text-wrap: pretty; }

        .font-display { font-weight: 700; letter-spacing: -0.03em; }
        .font-headline { font-weight: 600; letter-spacing: -0.02em; }
        .font-body { font-weight: 400; letter-spacing: -0.01em; }
        .font-caption { font-weight: 500; letter-spacing: 0.01em; font-size: 0.75rem; text-transform: uppercase; }

        /* Translucent Dark Gradient utilities */
        .glass {
            background: linear-gradient(135deg, rgba(24, 24, 30, 0.72) 0%, rgba(12, 12, 16, 0.82) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-strong {
            background: linear-gradient(135deg, rgba(28, 28, 36, 0.82) 0%, rgba(14, 14, 20, 0.9) 100%);
            backdrop-filter: blur(32px) saturate(190%);
            -webkit-backdrop-filter: blur(32px) saturate(190%);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-card {
            background: linear-gradient(145deg, rgba(24, 24, 32, 0.68) 0%, rgba(12, 13, 18, 0.78) 100%);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
        .glass-card-hover:hover {
            background: linear-gradient(145deg, rgba(34, 35, 46, 0.78) 0%, rgba(18, 19, 26, 0.88) 100%);
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, var(--accent-color) 0%, #60a5fa 50%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            background-size: 200% 200%;
            animation: gradient-shift 4s ease-in-out infinite;
        }
        .gradient-text-accent {
            background: linear-gradient(135deg, var(--accent-color) 0%, color-mix(in srgb, var(--accent-color) 70%, white) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Focus visible for accessibility */
        *:focus-visible {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }

        /* Selection */
        ::selection {
            background-color: var(--accent-color);
            color: #000;
        }
        ::-moz-selection {
            background-color: var(--accent-color);
            color: #000;
        }

        /* Smooth transitions without backdrop-filter compositor flicker */
        button, a, input, select, textarea {
            transition: background-color 0.22s var(--anim-ease),
                        border-color 0.22s var(--anim-ease),
                        color 0.18s var(--anim-ease),
                        box-shadow 0.22s var(--anim-ease),
                        transform 0.22s var(--anim-ease),
                        opacity 0.22s var(--anim-ease);
        }

        /* Reduced motion already handled above */

        /* Image rendering */
        img { image-rendering: auto; }
        img[loading="lazy"] { content-visibility: auto; }

        /* Container queries ready */
        @container (min-width: 400px) {
            .container-sm\:grid-cols-2 { grid-template-columns: repeat(2, 1fr); }
        }
        @container (min-width: 640px) {
            .container-md\:grid-cols-3 { grid-template-columns: repeat(3, 1fr); }
        }
        @container (min-width: 1024px) {
            .container-lg\:grid-cols-4 { grid-template-columns: repeat(4, 1fr); }
            .container-lg\:grid-cols-5 { grid-template-columns: repeat(5, 1fr); }
        }

        /* Scale-aware spacing utilities (respect --ui-scale) */
        .p-scale { padding: calc(1.5rem * var(--ui-scale, 1)); }
        .p-scale-sm { padding: calc(1rem * var(--ui-scale, 1)); }
        .p-scale-lg { padding: calc(2rem * var(--ui-scale, 1)); }
        .px-scale { padding-left: calc(1.5rem * var(--ui-scale, 1)); padding-right: calc(1.5rem * var(--ui-scale, 1)); }
        .py-scale { padding-top: calc(1.5rem * var(--ui-scale, 1)); padding-bottom: calc(1.5rem * var(--ui-scale, 1)); }
        .gap-scale { gap: calc(1.5rem * var(--ui-scale, 1)); }
        .gap-scale-sm { gap: calc(1rem * var(--ui-scale, 1)); }
        .gap-scale-lg { gap: calc(2rem * var(--ui-scale, 1)); }
        .space-y-scale > * + * { margin-top: calc(1.5rem * var(--ui-scale, 1)); }
        .space-x-scale > * + * { margin-left: calc(1.5rem * var(--ui-scale, 1)); }
    </style>
